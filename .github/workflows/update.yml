name: 실거래 업데이트

on:
  schedule:
    # 정각은 GitHub 예약 실행이 밀리거나 빠지는 일이 잦아 정각을 피하고, 예비 실행을 하나 더 둠
    - cron: '23 20 * * *'  # 매일 05:23 KST
    - cron: '41 22 * * *'  # 매일 07:41 KST (예비)
  workflow_dispatch:        # Actions 탭에서 "Run workflow" 로 수동 실행
  push:                     # 페이지·수집 도구를 고치면 바로 다시 배포
    branches: [main]
    paths: [index.html, tools/**, .github/workflows/update.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 지난 실행에서 받은 원자료를 이어서 사용 (매일 최근 2개월 + 못 받은 달만 새로 받음)
      - uses: actions/cache@v4
        with:
          path: cache
          key: molit-${{ github.run_id }}
          restore-keys: molit-
      - name: 과거 자료 풀기
        run: node tools/history.js unpack history cache
      - name: 국토부 실거래 수집·집계
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          DATA_DIR: _site/data
          CACHE_DIR: cache
          CONC: 1
        run: node tools/molit_sync.js 201601
      # 입주물량(청약홈) vs 적정수요(주민등록 인구) — 실패해도 배포는 계속
      - name: 입주물량·수요 수집
        continue-on-error: true
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          DATA_DIR: _site/data
          CACHE_DIR: cache
        run: node tools/supply_sync.js
      - name: 사이트 파일 준비
        run: cp index.html .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
